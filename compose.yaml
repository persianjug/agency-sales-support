services:
  postgres:
    image: postgres:16-alpine
    container_name: agency-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agency_db
      POSTGRES_USER: ${POSTGRES_USER:postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
