server:
  port: 8080

spring:
  application:
    name: sales

  # 起動時に schema.sql を自動実行する設定
  # sql:
  #   init:
  #     mode: always

  datasource:
    # 環境変数 POSTGRES_URL / USER / PASSWORD があれば上書き
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # メール送信設定（Mailpit / 外部SMTP）
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE}

# MyBatis 設定
mybatis:
  type-aliases-package: com.agency.sales.domain
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true # DBの snake_case を Javaの camelCase に自動変換

# JWT（認証）用カスタムプロパティ
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24時間 (ミリ秒)

# CORS 設定
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# ログレベル変更
logging:
  level:
    # 独自認証(JWT等)使用時に出るSpring Securityの不要なWARNログを抑止（ログレベルを ERROR に上げて非表示にする）
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR