server:
  port: 8080

spring:
  application:
    name: sales

  # 起動時に schema.sql を自動実行する設定
  # sql:
  #   init:
  #     mode: always

  datasource:
    # 環境変数 POSTGRES_URL / USER / PASSWORD があれば上書き
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

# MyBatis 設定
mybatis:
  type-aliases-package: com.agency.sales.domain
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true # DBの snake_case を Javaの camelCase に自動変換

# JWT（認証）用カスタムプロパティ
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24時間 (ミリ秒)

# ログレベル変更
logging:
  level:
    # 独自認証(JWT等)使用時に出るSpring Securityの不要なWARNログを抑止（ログレベルを ERROR に上げて非表示にする）
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR